[env:featheresp32]
platform = espressif32
board = featheresp32
framework = arduino
#include <Wire.h>
#include <WiFi.h>
#include <WebServer.h>
#include <LittleFS.h>
#include <LiquidCrystal_I2C.h>
#include <DHT.h>
#include <math.h>


#define SDA_PIN       21
#define SCL_PIN       22

#define DHT_PIN        4
#define DHT_TYPE       DHT11

#define POT_PIN       34

#define MOTOR_IN1     26
#define MOTOR_IN2     27
#define MOTOR_ENA     25

#define BUZZER_PIN    32

// =====================================================
// MPU6050
// =====================================================

#define MPU6050_ADDR  0x68

// =====================================================
// LCD
// =====================================================

#define LCD_ADDR      0x27

LiquidCrystal_I2C lcd(LCD_ADDR, 16, 2);

// =====================================================
// DHT
// =====================================================

DHT dht(DHT_PIN, DHT_TYPE);

// =====================================================
// WIFI
// =====================================================

const char* AP_SSID = "AI_Machine_Monitor";
const char* AP_PASSWORD = "12345678";

WebServer server(80);

// =====================================================
// PWM
// =====================================================

#define PWM_FREQ 20000
#define PWM_RES  8

// =====================================================
// TIMING
// =====================================================

unsigned long lastSensorRead = 0;
unsigned long lastLCDUpdate = 0;
unsigned long lastCSVWrite = 0;

const unsigned long SENSOR_INTERVAL = 1000;
const unsigned long LCD_INTERVAL = 1500;
const unsigned long CSV_INTERVAL = 1000;

// =====================================================
// SENSOR VARIABLES
// =====================================================

float accelX = 0.0;
float accelY = 0.0;
float accelZ = 0.0;

float vibration = 0.0;

float temperature = 0.0;
float humidity = 0.0;

int potValue = 0;

int motorPWM = 0;
int motorPercent = 0;

float healthScore = 100.0;

String machineStatus = "NORMAL";

bool mpuOK = false;
bool dhtOK = false;

// =====================================================
// MPU6050 INITIALIZATION
// =====================================================

void initMPU6050()
{
  Wire.beginTransmission(MPU6050_ADDR);
  Wire.write(0x6B);
  Wire.write(0x00);
  Wire.endTransmission(true);

  delay(100);

  // Accelerometer ±2g
  Wire.beginTransmission(MPU6050_ADDR);
  Wire.write(0x1C);
  Wire.write(0x00);
  Wire.endTransmission(true);

  // Gyroscope ±250 deg/s
  Wire.beginTransmission(MPU6050_ADDR);
  Wire.write(0x1B);
  Wire.write(0x00);
  Wire.endTransmission(true);
}

// =====================================================
// CHECK MPU6050
// =====================================================

bool checkMPU6050()
{
  Wire.beginTransmission(MPU6050_ADDR);
  return (Wire.endTransmission() == 0);
}

// =====================================================
// READ MPU6050
// =====================================================

bool readMPU6050()
{
  Wire.beginTransmission(MPU6050_ADDR);
  Wire.write(0x3B);

  if (Wire.endTransmission(false) != 0)
  {
    return false;
  }

  uint8_t received = Wire.requestFrom(MPU6050_ADDR, 6, true);

  if (received != 6)
  {
    return false;
  }

  int16_t rawX = (Wire.read() << 8) | Wire.read();
  int16_t rawY = (Wire.read() << 8) | Wire.read();
  int16_t rawZ = (Wire.read() << 8) | Wire.read();

  accelX = rawX / 16384.0;
  accelY = rawY / 16384.0;
  accelZ = rawZ / 16384.0;

  return true;
}

// =====================================================
// CALCULATE VIBRATION
// =====================================================

void calculateVibration()
{
  float magnitude = sqrt(
    accelX * accelX +
    accelY * accelY +
    accelZ * accelZ
  );

  vibration = fabs(magnitude - 1.0);

  if (vibration < 0)
  {
    vibration = 0;
  }
}

// =====================================================
// MOTOR CONTROL
// =====================================================

void controlMotor()
{
  potValue = analogRead(POT_PIN);

  motorPWM = map(potValue, 0, 4095, 0, 255);
  motorPercent = map(potValue, 0, 4095, 0, 100);

  // Motor direction
  if (motorPWM > 0)
  {
    digitalWrite(MOTOR_IN1, HIGH);
    digitalWrite(MOTOR_IN2, LOW);
  }
  else
  {
    digitalWrite(MOTOR_IN1, LOW);
    digitalWrite(MOTOR_IN2, LOW);
  }

  // ESP32 PWM
  ledcWrite(MOTOR_ENA, motorPWM);
}

// =====================================================
// MACHINE HEALTH
// =====================================================

void calculateHealth()
{
  healthScore = 100;

  // -------------------------------
  // VIBRATION
  // -------------------------------

  if (vibration > 0.18)
  {
    healthScore -= 50;
  }
  else if (vibration > 0.12)
  {
    healthScore -= 25;
  }
  else if (vibration > 0.08)
  {
    healthScore -= 10;
  }

  // -------------------------------
  // TEMPERATURE
  // -------------------------------

  if (temperature > 45)
  {
    healthScore -= 20;
  }
  else if (temperature > 35)
  {
    healthScore -= 10;
  }

  // -------------------------------
  // HUMIDITY
  // -------------------------------

  if (humidity > 80)
  {
    healthScore -= 10;
  }

  if (healthScore < 0)
  {
    healthScore = 0;
  }

  // -------------------------------
  // STATUS
  // -------------------------------

  if (vibration > 0.18 || temperature > 50)
  {
    machineStatus = "CRITICAL";
  }
  else if (
    vibration > 0.12 ||
    temperature > 40 ||
    humidity > 80
  )
  {
    machineStatus = "WARNING";
  }
  else
  {
    machineStatus = "NORMAL";
  }
}

// =====================================================
// BUZZER
// =====================================================

void controlBuzzer()
{
  if (machineStatus == "CRITICAL")
  {
    digitalWrite(BUZZER_PIN, HIGH);
  }
  else
  {
    digitalWrite(BUZZER_PIN, LOW);
  }
}

// =====================================================
// LCD
// =====================================================

void updateLCD()
{
  lcd.clear();

  lcd.setCursor(0, 0);
  lcd.print("V:");
  lcd.print(vibration, 2);

  lcd.print(" T:");
  lcd.print(temperature, 0);
  lcd.print("C");

  lcd.setCursor(0, 1);

  lcd.print(machineStatus);

  lcd.print(" ");
  lcd.print(motorPercent);
  lcd.print("%");
}

// =====================================================
// CREATE CSV FILE
// =====================================================

void initializeCSV()
{
  if (!LittleFS.exists("/machine_data.csv"))
  {
    File file = LittleFS.open("/machine_data.csv", FILE_WRITE);

    if (file)
    {
      file.println(
        "Timestamp_ms,Temperature_C,Humidity_percent,"
        "Potentiometer,Acceleration_X,Acceleration_Y,"
        "Acceleration_Z,Vibration_g,Motor_PWM,"
        "Motor_Percent,Health_Score,Status"
      );

      file.close();

      Serial.println("CSV file created.");
    }
    else
    {
      Serial.println("ERROR: Could not create CSV.");
    }
  }
  else
  {
    Serial.println("CSV file already exists.");
  }
}

// =====================================================
// SAVE DATA TO CSV
// =====================================================

void saveToCSV()
{
  File file = LittleFS.open("/machine_data.csv", FILE_APPEND);

  if (!file)
  {
    Serial.println("ERROR: Cannot open CSV file.");
    return;
  }

  file.print(millis());
  file.print(",");

  file.print(temperature, 1);
  file.print(",");

  file.print(humidity, 1);
  file.print(",");

  file.print(potValue);
  file.print(",");

  file.print(accelX, 3);
  file.print(",");

  file.print(accelY, 3);
  file.print(",");

  file.print(accelZ, 3);
  file.print(",");

  file.print(vibration, 3);
  file.print(",");

  file.print(motorPWM);
  file.print(",");

  file.print(motorPercent);
  file.print(",");

  file.print(healthScore, 0);
  file.print(",");

  file.println(machineStatus);

  file.close();
}

// =====================================================
// SERIAL MONITOR
// =====================================================

void printSerialData()
{
  Serial.println();
  Serial.println("================================");
  Serial.println("       MACHINE DATA");
  Serial.println("================================");

  Serial.print("Temperature : ");
  Serial.print(temperature, 1);
  Serial.println(" C");

  Serial.print("Humidity    : ");
  Serial.print(humidity, 1);
  Serial.println(" %");

  Serial.print("Potentiometer: ");
  Serial.print(potValue);
  Serial.print(" (");
  Serial.print(motorPercent);
  Serial.println("%)");

  Serial.print("Acceleration X: ");
  Serial.println(accelX, 3);

  Serial.print("Acceleration Y: ");
  Serial.println(accelY, 3);

  Serial.print("Acceleration Z: ");
  Serial.println(accelZ, 3);

  Serial.print("Vibration   : ");
  Serial.print(vibration, 3);
  Serial.println(" g");

  Serial.print("Motor PWM   : ");
  Serial.println(motorPWM);

  Serial.print("Health      : ");
  Serial.print(healthScore, 0);
  Serial.println("%");

  Serial.print("Status      : ");
  Serial.println(machineStatus);

  Serial.println("================================");
}

