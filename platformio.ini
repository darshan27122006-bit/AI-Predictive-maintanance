// =====================================================
// WEB ROOT
// =====================================================

void handleRoot()
{
  server.send(
    200,
    "text/html",
    getWebPage()
  );
}

// =====================================================
// DOWNLOAD CSV
// =====================================================

void handleDownload()
{
  if (!LittleFS.exists("/machine_data.csv"))
  {
    server.send(
      404,
      "text/plain",
      "CSV file not found"
    );

    return;
  }

  File file =
    LittleFS.open(
      "/machine_data.csv",
      FILE_READ
    );

  server.streamFile(
    file,
    "text/csv"
  );

  file.close();
}

// =====================================================
// CLEAR CSV
// =====================================================

void handleClearCSV()
{
  if (LittleFS.exists("/machine_data.csv"))
  {
    LittleFS.remove("/machine_data.csv");
  }

  initializeCSV();

  server.send(
    200,
    "text/plain",
    "CSV cleared and recreated."
  );
}

// =====================================================
// JSON API
// =====================================================

void handleAPI()
{
  String json = "{";

  json += "\"temperature\":";
  json += String(temperature, 1);

  json += ",\"humidity\":";
  json += String(humidity, 1);

  json += ",\"potentiometer\":";
  json += String(potValue);

  json += ",\"accelerationX\":";
  json += String(accelX, 3);

  json += ",\"accelerationY\":";
  json += String(accelY, 3);

  json += ",\"accelerationZ\":";
  json += String(accelZ, 3);

  json += ",\"vibration\":";
  json += String(vibration, 3);

  json += ",\"motorPWM\":";
  json += String(motorPWM);

  json += ",\"motorPercent\":";
  json += String(motorPercent);

  json += ",\"health\":";
  json += String(healthScore, 0);

  json += ",\"status\":\"";
  json += machineStatus;
  json += "\"";

  json += "}";

  server.send(
    200,
    "application/json",
    json
  );
}

// =====================================================
// SETUP
// =====================================================

void setup()
{
  Serial.begin(115200);

  delay(1000);

  Serial.println();
  Serial.println("================================");
  Serial.println(" AI PREDICTIVE MAINTENANCE");
  Serial.println(" ESP32 MASTER SYSTEM");
  Serial.println("================================");

  // -------------------------------
  // I2C
  // -------------------------------

  Wire.begin(
    SDA_PIN,
    SCL_PIN
  );

  // -------------------------------
  // LCD
  // -------------------------------

  lcd.init();
  lcd.backlight();

  lcd.clear();

  lcd.setCursor(0, 0);
  lcd.print("AI Machine");

  lcd.setCursor(0, 1);
  lcd.print("Starting...");

  // -------------------------------
  // DHT
  // -------------------------------

  dht.begin();

  delay(1000);

  // -------------------------------
  // MPU6050
  // -------------------------------

  initMPU6050();

  mpuOK = checkMPU6050();

  if (mpuOK)
  {
    Serial.println("MPU6050: OK");
  }
  else
  {
    Serial.println("MPU6050: NOT FOUND");
  }

  // -------------------------------
  // MOTOR
  // -------------------------------

  pinMode(
    MOTOR_IN1,
    OUTPUT
  );

  pinMode(
    MOTOR_IN2,
    OUTPUT
  );

  pinMode(
    BUZZER_PIN,
    OUTPUT
  );

  digitalWrite(
    MOTOR_IN1,
    LOW
  );

  digitalWrite(
    MOTOR_IN2,
    LOW
  );

  digitalWrite(
    BUZZER_PIN,
    LOW
  );

  // -------------------------------
  // POTENTIOMETER
  // -------------------------------

  analogReadResolution(12);

  // -------------------------------
  // ESP32 PWM
  // -------------------------------

  ledcAttach(
    MOTOR_ENA,
    PWM_FREQ,
    PWM_RES
  );

  ledcWrite(
    MOTOR_ENA,
    0
  );

  // -------------------------------
  // LITTLEFS
  // -------------------------------

  if (!LittleFS.begin(true))
  {
    Serial.println(
      "ERROR: LittleFS failed!"
    );
  }
  else
  {
    Serial.println(
      "LittleFS: OK"
    );

    initializeCSV();
  }

  // -------------------------------
  // WIFI ACCESS POINT
  // -------------------------------

  WiFi.softAP(
    AP_SSID,
    AP_PASSWORD
  );

  Serial.println();
  Serial.println("WiFi Access Point Started");

  Serial.print("SSID: ");
  Serial.println(AP_SSID);

  Serial.print("Password: ");
  Serial.println(AP_PASSWORD);

  Serial.print("IP Address: ");
  Serial.println(
    WiFi.softAPIP()
  );

  // -------------------------------
  // WEB SERVER
  // -------------------------------

  server.on(
    "/",
    handleRoot
  );

  server.on(
    "/download",
    handleDownload
  );

  server.on(
    "/clear",
    handleClearCSV
  );

  server.on(
    "/api/data",
    handleAPI
  );

  server.begin();

  Serial.println(
    "Web Server: Started"
  );

  Serial.println();
  Serial.println(
    "SYSTEM READY!"
  );

  Serial.println(
    "Open: 192.168.4.1"
  );

  lcd.clear();

  lcd.setCursor(0, 0);
  lcd.print("System Ready");

  lcd.setCursor(0, 1);
  lcd.print("WiFi: Connect");
}

// =====================================================
// LOOP
// =====================================================

void loop()
{
  // Web server
  server.handleClient();

  // Motor
  controlMotor();

  // -------------------------------
  // SENSOR READING
  // -------------------------------

  if (
    millis() - lastSensorRead >=
    SENSOR_INTERVAL
  )
  {
    lastSensorRead = millis();

    // MPU6050
    if (readMPU6050())
    {
      mpuOK = true;

      calculateVibration();
    }
    else
    {
      mpuOK = false;
    }

    // DHT11
    float newTemperature =
      dht.readTemperature();

    float newHumidity =
      dht.readHumidity();

    if (
      !isnan(newTemperature) &&
      !isnan(newHumidity)
    )
    {
      temperature =
        newTemperature;

      humidity =
        newHumidity;

      dhtOK = true;
    }
    else
    {
      dhtOK = false;
    }

    // Health
    calculateHealth();

    // Buzzer
    controlBuzzer();

    // Serial
    printSerialData();
  }

  // -------------------------------
  // CSV LOGGING
  // -------------------------------

  if (
    millis() - lastCSVWrite >=
    CSV_INTERVAL
  )
  {
    lastCSVWrite = millis();

    saveToCSV();
  }

  // -------------------------------
  // LCD
  // -------------------------------

  if (
    millis() - lastLCDUpdate >=
    LCD_INTERVAL
  )
  {
    lastLCDUpdate = millis();

    updateLCD();
  }
}